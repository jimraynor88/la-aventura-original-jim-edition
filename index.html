<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Aventura Original</title>

<!-- Móvil -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Aventura">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="dat/intro.png">

<!-- Estilos del juego -->
<link href="css.css" rel="stylesheet" type="text/css" />

<!-- ============================================================
     INTERFAZ EXTRA: menú, guardado, guía, opciones, comandos, PWA
     ============================================================ -->
<style>
/* ---------- Escalas globales ----------
   --game-fs  → escala del TEXTO DEL JUEGO
   --ui-fs    → escala de la INTERFAZ (menús, modales)
   ---------------------------------------- */
:root {
  --game-fs: 1;
  --ui-fs: 1;
  --ui-base: 13px;   /* tamaño base del panel: se multiplica por --ui-fs */
}

/* Texto del juego: base razonable en móvil */
body {
  font-size: calc(120% * var(--game-fs)) !important;
}
@media (max-width: 1024px) {
  body {
    font-size: calc(150% * var(--game-fs)) !important;
  }
}

/* ---------- Botón flotante del menú ---------- */
#ng-btn-menu {
  position: fixed;
  top: 8px;
  right: 8px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  z-index: 1400;
  transition: background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
  padding: 0;
}
#ng-btn-menu:hover  { background: rgba(43,108,176,.85); }
#ng-btn-menu:active { transform: scale(.92); }

/* ---------- Capa modal ---------- */
#ng-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 8px;
  box-sizing: border-box;
  /* Fuente explícita: NO hereda del body, así no se hace gigante */
  font-family: Verdana, arial, helvetica, sans-serif;
  font-size: calc(var(--ui-base) * var(--ui-fs));
  color: #e8e8e8;
  line-height: 1.4;
}
#ng-modal.open { display: flex; }

#ng-modal-box {
  background: #131313;
  border: 1px solid #2a2a2a;
  border-radius: 11px;
  width: 100%;
  max-width: 400px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,.7);
  overflow: hidden;
}

#ng-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px 8px 6px;
  border-bottom: 1px solid #242424;
  background: #161616;
}
#ng-modal-head > div { display: flex; align-items: center; min-width: 0; }
#ng-modal-title {
  font-weight: 600;
  font-size: 1em;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#ng-modal-back {
  background: none; border: none; color: #8ab4f8;
  font-size: 1.4em; line-height: 1;
  cursor: pointer; padding: 2px 8px 4px 6px;
  display: none;
  -webkit-tap-highlight-color: transparent;
}
#ng-modal-back.visible { display: inline-block; }
#ng-modal-x {
  background: none; border: none; color: #999;
  font-size: 1.15em; line-height: 1;
  cursor: pointer; padding: 4px 8px;
  -webkit-tap-highlight-color: transparent;
}
#ng-modal-x:hover { color: #fff; }

#ng-modal-body {
  padding: 10px 12px 14px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

/* ---------- Tipografía del panel ---------- */
#ng-modal-body h3 {
  margin: 2px 0 8px;
  font-size: .72em;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #6e6e6e;
  font-weight: 600;
  border-bottom: 1px solid #242424;
  padding-bottom: 4px;
}
#ng-modal-body h3:not(:first-child) { margin-top: 16px; }
#ng-modal-body p  { margin: 5px 0; font-size: .92em; }
#ng-modal-body ul { margin: 4px 0 4px 16px; padding: 0; font-size: .92em; }
#ng-modal-body li { margin: 3px 0; }
#ng-modal-body code {
  background: #242424; padding: 1px 5px; border-radius: 3px;
  font-family: ui-monospace, monospace; font-size: .9em; color: #ffd580;
}

/* ---------- Filas de acción tipo "menú" ---------- */
.ng-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  background: #1b1b1b;
  border: 1px solid #262626;
  margin-bottom: 5px;
  cursor: pointer;
  user-select: none;
  transition: background .12s, border-color .12s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.ng-item:hover  { background: #232323; border-color: #333; }
.ng-item:active { transform: scale(.985); }
.ng-item .ng-ico {
  font-size: 1.25em;
  width: 1.5em; text-align: center;
  flex-shrink: 0;
}
.ng-item .ng-txt { flex: 1; min-width: 0; }
.ng-item .ng-txt b {
  display: block; font-weight: 600; color: #fff; font-size: .95em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ng-item .ng-txt small {
  display: block; color: #888; font-size: .8em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ng-item .ng-arrow { color: #555; font-size: 1.1em; flex-shrink: 0; }

/* ---------- Botones ---------- */
.ng-btn {
  padding: 7px 12px;
  border-radius: 7px;
  border: 1px solid #383838;
  background: #1e1e1e; color: #eee;
  cursor: pointer; font-size: .88em;
  font-family: inherit;
  transition: background .12s, border-color .12s;
  -webkit-tap-highlight-color: transparent;
}
.ng-btn:hover  { background: #282828; border-color: #444; }
.ng-btn:active { transform: scale(.97); }
.ng-btn.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
.ng-btn.primary:hover { background: #377cc0; }
.ng-btn.danger { background: #7a1f1f; border-color: #7a1f1f; color: #fff; }
.ng-btn.danger:hover { background: #a12a2a; }
.ng-btn.mini { padding: 4px 9px; font-size: .78em; }

/* ---------- Input de nombre de partida ---------- */
.ng-input {
  width: 100%; box-sizing: border-box;
  padding: 9px 11px;
  border-radius: 7px;
  border: 1px solid #383838;
  background: #0b0b0b; color: #fff;
  font-size: .95em; outline: none;
  font-family: inherit;
}
.ng-input:focus { border-color: #2b6cb0; }
.ng-hint { font-size: .78em; color: #777; margin: 6px 0 12px; }

/* ---------- Filas de partidas ---------- */
.ng-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  background: #1a1a1a;
  border: 1px solid #242424;
  border-radius: 7px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}
.ng-row .ng-row-name {
  flex: 1; min-width: 100px;
  font-weight: 600; font-size: .9em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ng-row .ng-row-meta {
  font-size: .72em; color: #7d7d7d;
  white-space: nowrap;
}
.ng-row .ng-row-actions { display: flex; gap: 5px; }

/* ---------- Slider ---------- */
.ng-slider-row {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 0 12px;
}
.ng-slider-row input[type=range] {
  flex: 1;
  accent-color: #2b6cb0;
  min-width: 0;
}
.ng-slider-val {
  min-width: 44px; text-align: right;
  color: #bbb; font-size: .82em;
  font-variant-numeric: tabular-nums;
}

/* ---------- Toast ---------- */
.ng-toast {
  position: fixed; left: 50%; bottom: 20px;
  transform: translate(-50%, 16px);
  background: rgba(20,20,20,.96);
  color: #fff;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid #333;
  font-family: Verdana, sans-serif;
  font-size: 13px;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  z-index: 2100;
  pointer-events: none;
  white-space: nowrap;
  max-width: 88vw; overflow: hidden; text-overflow: ellipsis;
}
.ng-toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- ============================================================
     Estructura del juego (idéntica a la original)
     ============================================================ -->
<div class='wrapper'>
  <div class='graphics'></div>
  <div aria-live="polite" class='text'></div>
  <div class='input'>
    <input aria-live="polite" type='text' class='prompt' />
  </div>
</div>

<div class='block_layer'>
  <div class='block_graphics'></div>
  <div class='block_text'></div>
</div>

<div class='transcript_layer'>
  <span id='transcript_area'></span>
</div>

<div class='anykey_layer'></div>

<!-- ============================================================
     Motor del juego (NO TOCAR)
     ============================================================ -->
<script type="text/javascript" src="jquery.js"></script>
<script type="text/javascript" src="buzz.js"></script>
<script type='text/javascript' src='code.js'></script>

<!-- ============================================================
     INTERFAZ EXTRA
     ============================================================ -->
<script>
(function () {
  'use strict';

  // =========================================================
  //  UTILIDADES
  // =========================================================
  const PREFIX       = 'ngpaws_savegame_';
  const LAST         = 'ngpaws_last_save_name';
  const SETTINGS_KEY = 'ngpaws_settings';

  const $ = sel => document.querySelector(sel);

  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function listSaves() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.startsWith(PREFIX)) continue;
      const name = key.slice(PREFIX.length);
      let date = '', loc = '';
      try {
        const data = JSON.parse(localStorage.getItem(key));
        if (data.__savedAt) {
          const d = new Date(data.__savedAt);
          date = d.toLocaleDateString() + ' ' +
                 d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        if (data.flags && typeof data.flags[38] === 'number') loc = '📍 ' + data.flags[38];
      } catch (_) {}
      out.push({ name, date, loc });
    }
    out.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }));
    return out;
  }

  function nextDefaultName() {
    const saves = listSaves();
    let n = 1;
    while (saves.some(s => s.name === 'Partida ' + n)) n++;
    return 'Partida ' + n;
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'ng-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, 2000);
  }

  // =========================================================
  //  AJUSTES
  // =========================================================
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch (_) { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }

  let settings = loadSettings();

  function applySettings() {
    document.documentElement.style.setProperty('--game-fs', settings.fontScale || 1);
    document.documentElement.style.setProperty('--ui-fs',   settings.uiScale   || 1);
    if (typeof window.ACCsound === 'function') {
      window.ACCsound(settings.sound === false ? 0 : 1);
    }
    if (typeof window.ACCgraphic === 'function') {
      window.ACCgraphic(settings.graphics === false ? 0 : 1);
    }
  }

  // =========================================================
  //  MODAL — sistema de vistas con pila (para submenús)
  // =========================================================
  const viewStack = [];

  function ensureModal() {
    if ($('#ng-modal')) return;
    const modal = document.createElement('div');
    modal.id = 'ng-modal';
    modal.innerHTML = `
      <div id="ng-modal-box">
        <div id="ng-modal-head">
          <div>
            <button id="ng-modal-back" title="Atrás">‹</button>
            <span id="ng-modal-title"></span>
          </div>
          <button id="ng-modal-x" title="Cerrar">✕</button>
        </div>
        <div id="ng-modal-body"></div>
      </div>`;
    document.body.appendChild(modal);

    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    $('#ng-modal-x').addEventListener('click', closeModal);
    $('#ng-modal-back').addEventListener('click', popView);
  }

  function setView(view)      { viewStack.push(view); renderTop(); }
  function pushView(view)     { setView(view); }
  function replaceView(view)  { viewStack.pop(); setView(view); }
  function popView() {
    if (viewStack.length > 1) { viewStack.pop(); renderTop(); }
    else closeModal();
  }
  function renderTop() {
    const v = viewStack[viewStack.length - 1];
    if (!v) return;
    $('#ng-modal-title').textContent = v.title || '';
    $('#ng-modal-body').innerHTML = v.html || '';
    $('#ng-modal-back').classList.toggle('visible', viewStack.length > 1);
    $('#ng-modal-body').scrollTop = 0;
    if (typeof v.onMount === 'function') v.onMount();
  }

  function openModal(rootView) {
    ensureModal();
    viewStack.length = 0;
    setView(rootView);
    $('#ng-modal').classList.add('open');
  }
  function closeModal() {
    viewStack.length = 0;
    const m = $('#ng-modal');
    if (m) m.classList.remove('open');
  }

  // Helpers para generar HTML
  function item(icon, title, sub, id) {
    return `<div class="ng-item" id="${id}" data-act="${id}">
      <div class="ng-ico">${icon}</div>
      <div class="ng-txt">
        <b>${esc(title)}</b>
        ${sub ? `<small>${esc(sub)}</small>` : ''}
      </div>
      <div class="ng-arrow">›</div>
    </div>`;
  }

  function bindItems(map) {
    $('#ng-modal-body').querySelectorAll('.ng-item').forEach(el => {
      const act = el.dataset.act;
      el.addEventListener('click', () => {
        if (map[act]) map[act]();
      });
    });
  }

  // =========================================================
  //  VISTA: MENÚ PRINCIPAL
  // =========================================================
  function viewMain() {
    return {
      title: 'Menú',
      html: `
        <h3>Partida</h3>
        ${item('💾', 'Guardar',         'Crear o sobrescribir una partida', 'save')}
        ${item('📂', 'Cargar',          'Retomar una partida guardada',     'load')}
        ${item('🔄', 'Reiniciar',       'Volver al principio',              'restart')}

         <h3>Ajustes</h3>
        ${item('🔠', 'Tamaño del juego', 'Texto de la aventura',            'font')}
        ${item('🪟', 'Tamaño de menús',  'Interfaz y ventanas',             'ui')}
        ${item(settings.sound === false ? '🔇' : '🔊',
               'Sonido',      settings.sound === false ? 'Desactivado' : 'Activado', 'sound')}
        ${item(settings.graphics === false ? '🚫' : '🖼️',
               'Gráficos',    settings.graphics === false ? 'Desactivados' : 'Activados', 'graphics')}
        ${item('📡', 'Estado offline',   'Comprobar caché y modo sin conexión', 'offline')}
        <h3>Ayuda</h3>
        ${item('📖', 'Cómo jugar',  'Guía básica de la aventura', 'guide')}
        ${item('⌨️', 'Comandos',    'Listado por categorías',     'cmds')}
        ${item('ℹ️', 'Acerca de',   'Créditos e información',     'about')}
      `,
      onMount() {
        bindItems({
          save:     () => pushView(viewSave()),
          load:     () => pushView(viewLoad()),
          restart:  () => pushView(viewRestart()),
          font:     () => pushView(viewFont()),
          ui:       () => pushView(viewUISize()),
          sound:    () => { toggleSound();    replaceView(viewMain()); },
          graphics: () => { toggleGraphics(); replaceView(viewMain()); },
          guide:    () => pushView(viewGuide()),
          cmds:     () => pushView(viewCommands()),
          about:    () => pushView(viewAbout()),
          offline:  () => pushView(viewOffline()),
        });
      }
    };
  }

  // =========================================================
  //  VISTAS: GUARDAR / CARGAR / REINICIAR
  // =========================================================
  function viewSave() {
    const last  = localStorage.getItem(LAST) || nextDefaultName();
    const saves = listSaves();
    const rows  = saves.length
      ? saves.map(s => `
          <div class="ng-row">
            <span class="ng-row-name">${esc(s.name)}</span>
            <span class="ng-row-meta">${esc(s.date)} ${esc(s.loc)}</span>
            <button class="ng-btn mini" data-fill="${esc(s.name)}">Usar</button>
          </div>`).join('')
      : '<p style="color:#888;text-align:center;font-style:italic">Aún no hay partidas guardadas.</p>';

    return {
      title: '💾 Guardar',
      html: `
        <p style="color:#aaa;font-size:.88em">
          Escribe un nombre, o pulsa <b>Usar</b> en una existente para sobrescribirla.
        </p>
        <input id="ng-save-name" class="ng-input" type="text"
               value="${esc(last)}" autocomplete="off" maxlength="40" />
        <p class="ng-hint">Pulsa <b>Enter</b> para guardar al instante.</p>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px">
          <button id="ng-save-go" class="ng-btn primary">Guardar</button>
        </div>
        <h3>Partidas existentes</h3>
        ${rows}
      `,
      onMount() {
        const input = $('#ng-save-name');
        const goBtn = $('#ng-save-go');
        setTimeout(() => { input.focus(); input.select(); }, 30);

        const doSave = () => {
          const name = input.value.trim().toUpperCase();
          if (!name) { toast('Pon un nombre a la partida'); return; }
          try {
            const obj = window.getSaveGameObject();
            obj.__savedAt = Date.now();
            localStorage.setItem(PREFIX + name, JSON.stringify(obj));
            localStorage.setItem(LAST, name);
            toast('💾 Guardado: ' + name);
            popView();
          } catch (e) {
            toast('Error al guardar: ' + e.message);
          }
        };

        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSave(); }
        });
        goBtn.addEventListener('click', doSave);

        $('#ng-modal-body').querySelectorAll('[data-fill]').forEach(b => {
          b.addEventListener('click', () => {
            input.value = b.dataset.fill;
            input.focus(); input.select();
          });
        });
      }
    };
  }

  function viewLoad() {
    const saves = listSaves();
    const rows  = saves.length
      ? saves.map(s => `
          <div class="ng-row">
            <span class="ng-row-name">${esc(s.name)}</span>
            <span class="ng-row-meta">${esc(s.date)} ${esc(s.loc)}</span>
            <div class="ng-row-actions">
              <button class="ng-btn primary mini" data-load="${esc(s.name)}">Cargar</button>
              <button class="ng-btn danger mini"  data-del="${esc(s.name)}" title="Borrar">🗑️</button>
            </div>
          </div>`).join('')
      : '<p style="color:#888;text-align:center;font-style:italic">No hay partidas guardadas.</p>';

    return {
      title: '📂 Cargar',
      html: `<h3>Selecciona una partida</h3>${rows}`,
      onMount() {
        $('#ng-modal-body').querySelectorAll('[data-load]').forEach(b => {
          b.addEventListener('click', () => {
            const name = b.dataset.load;
            const json = localStorage.getItem(PREFIX + name);
            if (!json) { toast('No encontrada'); return; }
            try {
              const obj = JSON.parse(json);
              window.restoreSaveGameObject(obj);
              closeModal();
              if (typeof window.descriptionLoop === 'function') window.descriptionLoop();
              toast('📂 Cargada: ' + name);
            } catch (e) {
              toast('Error al cargar: ' + e.message);
            }
          });
        });
        $('#ng-modal-body').querySelectorAll('[data-del]').forEach(b => {
          b.addEventListener('click', () => {
            const name = b.dataset.del;
            if (!confirm('¿Borrar la partida «' + name + '»?')) return;
            localStorage.removeItem(PREFIX + name);
            if (localStorage.getItem(LAST) === name) localStorage.removeItem(LAST);
            replaceView(viewLoad());
            toast('🗑️ Borrada: ' + name);
          });
        });
      }
    };
  }

  function viewRestart() {
    return {
      title: '🔄 Reiniciar',
      html: `
        <p>¿Seguro que quieres <b>reiniciar</b> la aventura?</p>
        <p style="color:#888;font-size:.85em">
          Perderás el progreso actual. Tus partidas guardadas se mantienen.
        </p>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
          <button id="ng-r-no"  class="ng-btn">Cancelar</button>
          <button id="ng-r-yes" class="ng-btn danger">Reiniciar</button>
        </div>
      `,
      onMount() {
        $('#ng-r-no').addEventListener('click', popView);
        $('#ng-r-yes').addEventListener('click', () => location.reload());
      }
    };
  }

  // =========================================================
  //  VISTAS: AJUSTES
  // =========================================================
  function viewFont() {
    const pct = Math.round((settings.fontScale || 1) * 100);
    return {
      title: '🔠 Tamaño del juego',
      html: `
        <p style="color:#aaa;font-size:.88em">
          Ajusta el tamaño del texto de la aventura.
        </p>
        <div class="ng-slider-row">
          <span style="color:#666;font-size:.8em">Aa</span>
          <input id="ng-fr" type="range" min="30" max="250" step="5" value="${pct}" />
          <span style="color:#ccc;font-size:1.4em">Aa</span>
        </div>
        <div class="ng-slider-row" style="padding-top:0">
          <span style="flex:1;color:#888;font-size:.82em">Valor actual</span>
          <span id="ng-fv" class="ng-slider-val" style="min-width:60px">${pct}%</span>
        </div>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:6px">
          <button id="ng-f-reset" class="ng-btn">100 %</button>
          <button id="ng-f-ok"    class="ng-btn primary">Aplicar</button>

  // =========================================================
  //  VISTA: ESTADO OFFLINE (diagnóstico)
  // =========================================================
  async function viewOffline() {
    let swSupported = ('serviceWorker' in navigator);
    let swReg = null, swActive = false, swController = false;
    let cacheName = null, cacheCount = 0, error = null;

    try {
      if (swSupported) {
        swReg = await navigator.serviceWorker.getRegistration();
        if (swReg) {
          swActive     = !!swReg.active;
          swController = !!navigator.serviceWorker.controller;
        }
      }
      const names = await caches.keys();
      for (const name of names) {
        if (!name.startsWith('aventura')) continue;
        const c    = await caches.open(name);
        const keys = await c.keys();
        if (keys.length > cacheCount) {
          cacheName  = name;
          cacheCount = keys.length;
        }
      }
    } catch (e) { error = e.message; }

    const row = (label, value, ok) =>
      `<div class="ng-row">
         <span class="ng-row-name">${esc(label)}</span>
         <span class="ng-row-meta" style="color:${ok === false ? '#e88' : ok === true ? '#8d8' : '#ccc'}">
           ${esc(value)}
         </span>
       </div>`;

    return {
      title: '📡 Estado offline',
      html: `
        <p style="color:#aaa;font-size:.88em">
          Comprueba si la app está lista para funcionar sin conexión.
        </p>

        <h3>Servicio offline (SW)</h3>
        ${row('Soportado',    swSupported ? '✅ Sí' : '❌ No', swSupported)}
        ${row('Registrado',   swReg ? '✅ Sí' : '❌ No', !!swReg)}
        ${row('Activo',       swActive ? '✅ Sí' : '❌ No', swActive)}
        ${row('Controlando',  swController ? '✅ Sí' : '⚠️ Recarga', swController)}

        <h3>Archivos en caché</h3>
        ${row(cacheName || '(ninguno)', cacheCount + ' archivos', cacheCount > 30)}

        ${error ? `<h3>Errores</h3><p style="color:#f88;font-size:.85em">${esc(error)}</p>` : ''}

        <h3>Acciones</h3>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <button id="ng-ck-recheck" class="ng-btn">🔁 Volver a comprobar</button>
          <button id="ng-ck-force"   class="ng-btn primary">⬇️ Forzar re-descarga de todo</button>
          <button id="ng-ck-clear"   class="ng-btn danger">🗑️ Borrar toda la caché</button>
        </div>

        <p style="color:#777;font-size:.8em;margin-top:16px">
          <b>Controlando ⚠️</b> → cierra y reabre la app, o recarga.
          <b>Menos de 30 archivos</b> → aún se está descargando: espera 1 minuto con red.
          Todo debería llegar a <b>~110 archivos</b> cuando esté completo.
        </p>
      `,
      onMount() {
        $('#ng-ck-recheck').addEventListener('click', () => replaceView(viewOffline()));

        $('#ng-ck-force').addEventListener('click', () => {
          if (!navigator.serviceWorker.controller) {
            toast('Primero recarga la página');
            return;
          }
          navigator.serviceWorker.controller.postMessage('FORCE_RECACHE');
          toast('Re-descargando caché...');
        });

        $('#ng-ck-clear').addEventListener('click', async () => {
          if (!confirm('¿Borrar toda la caché? La próxima visita tardará más.')) return;
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
          toast('Caché borrada. Cierra y reabre la app.');
        });
      }
    };
  }

  // =========================================================

  function addMenuButton() {
    if ($('#ng-btn-menu')) return;
    const btn = document.createElement('button');
    btn.id = 'ng-btn-menu';
    btn.title = 'Menú';
    btn.setAttribute('aria-label', 'Menú');
    btn.textContent = '☰';
    btn.addEventListener('click', () => openModal(viewMain()));
    document.body.appendChild(btn);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' &&
        $('#ng-modal') && $('#ng-modal').classList.contains('open')) {
      closeModal();
      e.preventDefault();
    }
  });

  // =========================================================
  //  SUSTITUIR LOS prompt() DEL JUEGO
  // =========================================================
  function overrideGameSaveLoad() {
    if (typeof window.ACCsave === 'function')
      window.ACCsave = function () { openModal(viewSave()); };
    if (typeof window.ACCload === 'function')
      window.ACCload = function () { openModal(viewLoad()); };
  }

  // =========================================================
  //  REGISTRAR SERVICE WORKER
  // =========================================================
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => {
        console.log('SW registrado. Scope:', reg.scope);
        reg.update().catch(() => {});
      })
      .catch(err => console.warn('SW no registrado:', err));
  }

  // =========================================================
  //  INICIALIZACIÓN
  // =========================================================
  function init() {
    setTimeout(() => {
      try { applySettings(); } catch (_) {}
      addMenuButton();
      overrideGameSaveLoad();
      registerSW();
      console.log('Interfaz extra cargada.');
    }, 0);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }

  // Acceso desde consola para depurar
  window.ngpaws = {
    openMenu:  () => openModal(viewMain()),
    showSave:  () => openModal(viewSave()),
    showLoad:  () => openModal(viewLoad()),
    showCmds:  () => openModal(viewCommands()),
    listSaves
  };
})();
