<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Aventura Original</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Aventura">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="dat/intro.png">
<link href="css.css" rel="stylesheet" type="text/css" />
<style>
:root { --game-fs: 1; --ui-fs: 1; --ui-base: 13px; }
body { font-size: calc(120% * var(--game-fs)) !important; }
@media (max-width: 1024px) { body { font-size: calc(150% * var(--game-fs)) !important; } }

#ng-btn-menu {
  position: fixed; top: 8px; right: 8px;
  width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.55); color: #fff;
  font-size: 17px; line-height: 1; cursor: pointer;
  z-index: 1400; transition: background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px); padding: 0;
}
#ng-btn-menu:hover  { background: rgba(43,108,176,.85); }
#ng-btn-menu:active { transform: scale(.92); }

/* =========================================================
   Barra rápida a dos filas, centrada, con agrupación visual
   ========================================================= */
#ng-quickbar {
  position: absolute;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 720px;
  padding: 5px 6px;
  box-sizing: border-box;
  background: rgba(0,0,0,.78);
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.08);
  font-family: Verdana, sans-serif;
  z-index: 100;
  display: none;
  flex-direction: column;
  gap: 3px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
#ng-quickbar.on { display: flex; }

.ng-qb-row {
  display: flex;
  gap: 3px;
  width: 100%;
}

.ng-qb-btn {
  flex: 1 1 0;
  min-width: 0;
  height: 30px;
  padding: 0 3px;
  border-radius: 6px;
  border: 1px solid #333;
  background: #1a1a1a;
  color: #eaeaea;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  -webkit-tap-highlight-color: transparent;
  transition: background .12s, border-color .12s, filter .12s;
}
.ng-qb-btn:hover  { filter: brightness(1.25); }
.ng-qb-btn:active { transform: scale(.95); }

/* --- Zona izquierda: salir / salidas / bajar (salir del sitio) --- */
.ng-qb-btn.out {
  background: #2a1a1a;
  border-color: #4a2a2a;
  color: #e8d0d0;
}
.ng-qb-btn.out:hover { background: #4a2a2a; border-color: #6a3a3a; filter: none; }

/* --- Zona derecha: entrar / subir / mirar (internarse, mirar) --- */
.ng-qb-btn.in {
  background: #1a2030;
  border-color: #2a3a5a;
  color: #d0e0f0;
}
.ng-qb-btn.in:hover { background: #2a3a5a; border-color: #3a5a7a; filter: none; }

/* --- Direcciones (neutro) --- */
.ng-qb-btn.dir {
  background: #1a1a1a;
  border-color: #333;
}
.ng-qb-btn.dir:hover { background: #2a2a2a; border-color: #444; filter: none; }

/* --- Botón Diag. (morado, con indicador de desplegable) --- */
.ng-qb-btn.diag {
  background: #2a1a3a;
  border-color: #4a2a6a;
  color: #e0d0f0;
  font-weight: 600;
}
.ng-qb-btn.diag::after {
  content: ' ▾';
  font-size: .85em;
  opacity: .7;
}
.ng-qb-btn.diag:hover,
.ng-qb-btn.diag.open {
  background: #4a2a6a;
  border-color: #6a3a8a;
  filter: none;
}
.ng-qb-btn.diag.open::after { content: ' ▴'; }

/* --- Mirar: destacado en azul (manda sobre .in por orden) --- */
.ng-qb-btn.primary {
  background: #2b6cb0;
  border-color: #2b6cb0;
  color: #fff;
  font-weight: 600;
}
.ng-qb-btn.primary:hover {
  background: #377cc0;
  border-color: #377cc0;
  filter: none;
}

/* En pantallas muy estrechas, apretamos un poco */
@media (max-width: 480px) {
  .ng-qb-btn { font-size: 10px; height: 28px; }
  #ng-quickbar { padding: 4px; }
}

/* =========================================================
   MODAL (menú, guardar, cargar, mapa, etc.)
   ========================================================= */
#ng-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.75);
  display: none; align-items: center; justify-content: center;
  z-index: 2000; padding: 8px; box-sizing: border-box;
  font-family: Verdana, arial, helvetica, sans-serif;
  font-size: calc(var(--ui-base) * var(--ui-fs));
  color: #e8e8e8; line-height: 1.4;
}
#ng-modal.open { display: flex; }
#ng-modal-box {
  background: #131313; border: 1px solid #2a2a2a; border-radius: 11px;
  width: 100%; max-width: 400px; max-height: 92vh;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 50px rgba(0,0,0,.7); overflow: hidden;
}
#ng-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px 8px 6px;
  border-bottom: 1px solid #242424; background: #161616;
}
#ng-modal-head > div { display: flex; align-items: center; min-width: 0; }
#ng-modal-title {
  font-weight: 600; font-size: 1em; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#ng-modal-back {
  background: none; border: none; color: #8ab4f8;
  font-size: 1.4em; line-height: 1; cursor: pointer;
  padding: 2px 8px 4px 6px; display: none;
  -webkit-tap-highlight-color: transparent;
}
#ng-modal-back.visible { display: inline-block; }
#ng-modal-x {
  background: none; border: none; color: #999;
  font-size: 1.15em; line-height: 1; cursor: pointer;
  padding: 4px 8px; -webkit-tap-highlight-color: transparent;
}
#ng-modal-x:hover { color: #fff; }
#ng-modal-body {
  padding: 10px 12px 14px; overflow-y: auto; flex: 1;
  -webkit-overflow-scrolling: touch;
}
#ng-modal-body h3 {
  margin: 2px 0 8px; font-size: .72em;
  text-transform: uppercase; letter-spacing: .1em;
  color: #6e6e6e; font-weight: 600;
  border-bottom: 1px solid #242424; padding-bottom: 4px;
}
#ng-modal-body h3:not(:first-child) { margin-top: 16px; }
#ng-modal-body p  { margin: 5px 0; font-size: .92em; }
#ng-modal-body ul { margin: 4px 0 4px 16px; padding: 0; font-size: .92em; }
#ng-modal-body li { margin: 3px 0; }
#ng-modal-body code {
  background: #242424; padding: 1px 5px; border-radius: 3px;
  font-family: ui-monospace, monospace; font-size: .9em; color: #ffd580;
}
.ng-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 8px;
  background: #1b1b1b; border: 1px solid #262626;
  margin-bottom: 5px; cursor: pointer; user-select: none;
  transition: background .12s, border-color .12s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.ng-item:hover  { background: #232323; border-color: #333; }
.ng-item:active { transform: scale(.985); }
.ng-item .ng-ico { font-size: 1.25em; width: 1.5em; text-align: center; flex-shrink: 0; }
.ng-item .ng-txt { flex: 1; min-width: 0; }
.ng-item .ng-txt b { display: block; font-weight: 600; color: #fff; font-size: .95em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ng-item .ng-txt small { display: block; color: #888; font-size: .8em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ng-item .ng-arrow { color: #555; font-size: 1.1em; flex-shrink: 0; }
.ng-btn {
  padding: 7px 12px; border-radius: 7px;
  border: 1px solid #383838; background: #1e1e1e; color: #eee;
  cursor: pointer; font-size: .88em; font-family: inherit;
  transition: background .12s, border-color .12s;
  -webkit-tap-highlight-color: transparent;
}
.ng-btn:hover  { background: #282828; border-color: #444; }
.ng-btn:active { transform: scale(.97); }
.ng-btn.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
.ng-btn.primary:hover { background: #377cc0; }

  
/* Panel desplegable de diagonales */
.ng-diag-popup {
  position: fixed;
  z-index: 150;
  display: none;
  background: rgba(20,20,20,.97);
  border: 1px solid #333;
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 8px 20px rgba(0,0,0,.7);
  backdrop-filter: blur(6px);
}
.ng-diag-popup.open { display: block; }
.ng-diag-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.ng-diag-grid .ng-qb-btn {
  margin: 0;
  min-width: 58px;
  height: 34px;
  line-height: 32px;
  font-size: 13px;
}
.ng-btn.danger { background: #7a1f1f; border-color: #7a1f1f; color: #fff; }
.ng-btn.danger:hover { background: #a12a2a; }
.ng-btn.mini { padding: 4px 9px; font-size: .78em; }
.ng-input {
  width: 100%; box-sizing: border-box; padding: 9px 11px;
  border-radius: 7px; border: 1px solid #383838;
  background: #0b0b0b; color: #fff;
  font-size: .95em; outline: none; font-family: inherit;
}
.ng-input:focus { border-color: #2b6cb0; }
.ng-hint { font-size: .78em; color: #777; margin: 6px 0 12px; }
.ng-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #1a1a1a;
  border: 1px solid #242424; border-radius: 7px;
  margin-bottom: 5px; flex-wrap: wrap;
}
.ng-row .ng-row-name { flex: 1; min-width: 100px;
  font-weight: 600; font-size: .9em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ng-row .ng-row-meta { font-size: .72em; color: #7d7d7d; white-space: nowrap; }
.ng-row .ng-row-actions { display: flex; gap: 5px; }
.ng-slider-row { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
.ng-slider-row input[type=range] { flex: 1; accent-color: #2b6cb0; min-width: 0; }
.ng-slider-val { min-width: 44px; text-align: right; color: #bbb; font-size: .82em;
  font-variant-numeric: tabular-nums; }
.ng-map-wrap { overflow: auto; -webkit-overflow-scrolling: touch;
  background: #0a0a0a; border: 1px solid #242424; border-radius: 8px;
  padding: 6px; max-height: 60vh; }
.ng-toast {
  position: fixed; left: 50%; bottom: 20px;
  transform: translate(-50%, 16px);
  background: rgba(20,20,20,.96); color: #fff;
  padding: 8px 16px; border-radius: 999px;
  border: 1px solid #333; font-family: Verdana, sans-serif;
  font-size: 13px; opacity: 0;
  transition: opacity .25s, transform .25s;
  z-index: 2100; pointer-events: none;
  white-space: nowrap; max-width: 88vw;
  overflow: hidden; text-overflow: ellipsis;
}
.ng-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
   Scroll minimalista: solo aparece cuando hace falta
   ========================================================= */
html, body {
  overflow: hidden;
  height: 100%;
  overscroll-behavior: none;   /* evita rebote en móvil */
}

/* Área de texto del juego */
.text {
  overflow-y: auto !important; /* el css.css lo tenía en scroll */
  scrollbar-width: thin;                 /* Firefox */
  scrollbar-color: #2f2f2f transparent;  /* Firefox */
}
.text::-webkit-scrollbar        { width: 6px; height: 6px; }
.text::-webkit-scrollbar-track  { background: transparent; }
.text::-webkit-scrollbar-thumb  {
  background: #2f2f2f;
  border-radius: 3px;
}
.text::-webkit-scrollbar-thumb:hover { background: #555; }

/* Modal, mapa y transcripción: mismo tratamiento */
#ng-modal-body,
.ng-map-wrap,
.transcript_layer,
#transcript_area {
  scrollbar-width: thin;
  scrollbar-color: #2f2f2f transparent;
}
#ng-modal-body::-webkit-scrollbar,
.ng-map-wrap::-webkit-scrollbar,
.transcript_layer::-webkit-scrollbar,
#transcript_area::-webkit-scrollbar        { width: 6px; height: 6px; }
#ng-modal-body::-webkit-scrollbar-track,
.ng-map-wrap::-webkit-scrollbar-track,
.transcript_layer::-webkit-scrollbar-track,
#transcript_area::-webkit-scrollbar-track  { background: transparent; }
#ng-modal-body::-webkit-scrollbar-thumb,
.ng-map-wrap::-webkit-scrollbar-thumb,
.transcript_layer::-webkit-scrollbar-thumb,
#transcript_area::-webkit-scrollbar-thumb  {
  background: #2f2f2f;
  border-radius: 3px;
}
#ng-modal-body::-webkit-scrollbar-thumb:hover,
.ng-map-wrap::-webkit-scrollbar-thumb:hover,
.transcript_layer::-webkit-scrollbar-thumb:hover,
#transcript_area::-webkit-scrollbar-thumb:hover { background: #555; }  
</style>
</head>
<body>

<div class='wrapper'>
  <div class='graphics'></div>
  <div aria-live="polite" class='text'></div>
  <div class='input'>
    <input aria-live="polite" type='text' class='prompt' />
  </div>
</div>
<div class='block_layer'>
  <div class='block_graphics'></div>
  <div class='block_text'></div>
</div>
<div class='transcript_layer'>
  <span id='transcript_area'></span>
</div>
<div class='anykey_layer'></div>

<script type="text/javascript" src="jquery.js"></script>
<script type="text/javascript" src="buzz.js"></script>
<script type='text/javascript' src='code.js'></script>

<script>
(function () {
  'use strict';

  // =========================================================
  //  FIX: alias del recurso 1 → dat/intro.png
  // =========================================================
  try {
    if (typeof resources !== 'undefined' && Array.isArray(resources)) {
      const yaExiste = resources.some(r => r[0] === 1 && r[1] === 1);
      if (!yaExiste) resources.push([1, 1, 'dat/intro.png']);
    }
  } catch (_) {}

  // =========================================================
  //  FIX: limpiar caracteres de control PAWS (SOH = \x01)
  // =========================================================
  if (typeof window.filterText === 'function') {
    const _filterText_orig = window.filterText;
    window.filterText = function (text) {
      if (typeof text === 'string') {
        text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
      }
      return _filterText_orig(text);
    };
  }

  // =========================================================
  //  FIX MÓVIL: no abrir el teclado automáticamente.
  //  El motor llama a focusInput() constantemente (al arrancar,
  //  tras cada comando, tras descripciones...). En móvil eso
  //  despliega el teclado en pantalla sin que el jugador lo pida.
  //  Solución: solo reponemos el foco si el usuario ya lo tenía
  //  puesto, o sea, si estaba escribiendo. Si no, no hacemos nada
  //  y el teclado permanece cerrado hasta que el usuario toque
  //  el input directamente.
  // =========================================================
  (function () {
    if (typeof window.focusInput !== 'function') return;
    const isTouch = ('ontouchstart' in window) ||
                    (typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 0);
    if (!isTouch) return;  // En escritorio, comportamiento original.

    const _focusInput_orig = window.focusInput;
    window.focusInput = function () {
      const prompt = document.querySelector('.prompt');
      const wasFocused = prompt && document.activeElement === prompt;

      // Reseteamos el timeout de la partida igual que hacía el original.
      try { window.timeout_progress = 0; } catch (_) {}

      // Bajamos el scroll del texto hasta el final para que se vea
      // la última línea, ya que ya no la forzamos por el foco.
      const txt = document.querySelector('.text');
      if (txt) txt.scrollTop = txt.scrollHeight;

      // Solo reponemos foco si el usuario ya estaba escribiendo.
      if (wasFocused) {
        return _focusInput_orig.apply(this, arguments);
      }
    };
  })();
  
  // =========================================================
  //  UTILIDADES
  // =========================================================
  const PREFIX       = 'ngpaws_savegame_';
  const LAST         = 'ngpaws_last_save_name';
  const SETTINGS_KEY = 'ngpaws_settings';
  const VISITED_KEY  = 'ngpaws_visited';
  const AUTO_SLOT    = '__AUTO__';
  const AUTO_EVERY   = 10;

  const $ = sel => document.querySelector(sel);
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'ng-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, 2000);
  }

  function listSaves() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.startsWith(PREFIX)) continue;
      const name = key.slice(PREFIX.length);
      let date = '', loc = '', auto = false;
      try {
        const data = JSON.parse(localStorage.getItem(key));
        if (data.__savedAt) {
          const d = new Date(data.__savedAt);
          date = d.toLocaleDateString() + ' ' +
                 d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        if (data.flags && typeof data.flags[38] === 'number') loc = '📍 ' + data.flags[38];
        if (data.__auto || name === AUTO_SLOT) auto = true;
      } catch (_) {}
      out.push({ name, date, loc, auto });
    }
    out.sort((a, b) => {
      if (a.auto && !b.auto) return -1;
      if (!a.auto && b.auto) return 1;
      return a.name.localeCompare(b.name, 'es', { numeric: true });
    });
    return out;
  }

  function nextDefaultName() {
    const saves = listSaves().filter(s => !s.auto);
    let n = 1;
    while (saves.some(s => s.name === 'Partida ' + n)) n++;
    return 'Partida ' + n;
  }

  function saveName(name)  { return (name || '').trim().toUpperCase(); }
  function doLocalSave(name, extra) {
    const key = saveName(name);
    if (!key) return false;
    const obj = window.getSaveGameObject();
    obj.__savedAt = Date.now();
    if (extra) Object.assign(obj, extra);
    localStorage.setItem(PREFIX + key, JSON.stringify(obj));
    if (key !== AUTO_SLOT) localStorage.setItem(LAST, key);
    return true;
  }

  function canSendCommand() {
    return !(
      window.inAnykey ||
      window.inBlock ||
      window.inQUIT ||
      window.inEND   ||
      window.inGetkey ||
      window.inAsk ||
      window.inPause
    );
  }

  // =========================================================
  //  AJUSTES
  // =========================================================
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch (_) { return {}; }
  }
  function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

  let settings = loadSettings();

  function applySettings() {
    document.documentElement.style.setProperty('--game-fs', settings.fontScale || 1);
    document.documentElement.style.setProperty('--ui-fs',   settings.uiScale   || 1);
    if (typeof window.ACCsound === 'function') {
      window.ACCsound(settings.sound === false ? 0 : 1);
    }
    if (typeof window.ACCgraphic === 'function') {
      window.ACCgraphic(settings.graphics === false ? 0 : 1);
    }
    const qb = $('#ng-quickbar');
    if (qb) qb.classList.toggle('on', settings.quickbar !== false);
  }

  // =========================================================
  //  VISITADOS (para el mapa)
  // =========================================================
  function getVisitedSet() {
    try { return new Set(JSON.parse(localStorage.getItem(VISITED_KEY)) || []); }
    catch (_) { return new Set(); }
  }
  function saveVisitedSet(set) {
    localStorage.setItem(VISITED_KEY, JSON.stringify([...set]));
  }
  function markVisited(locno) {
    if (typeof locno !== 'number' || locno < 3) return;
    const v = getVisitedSet();
    if (!v.has(locno)) { v.add(locno); saveVisitedSet(v); }
  }

  // Hook: marca visita cada vez que se dibuja una localidad
  (function () {
    const _dp = window.drawPicture;
    if (typeof _dp === 'function') {
      window.drawPicture = function () {
        markVisited(window.getFlag(38));
        return _dp.apply(this, arguments);
      };
    }
    const _ag = window.ACCgoto;
    if (typeof _ag === 'function') {
      window.ACCgoto = function (locno) {
        const r = _ag.apply(this, arguments);
        markVisited(locno);
        return r;
      };
    }
  })();

  // =========================================================
  //  AUTOGUARDADO
  // =========================================================
  let lastAutosaveTurn = -1;
  function tryAutosave() {
    if (settings.autosave === false) return;
    if (typeof window.getSaveGameObject !== 'function') return;
    const t = window.getFlag(31) + 256 * window.getFlag(32);
    if (!t || t === lastAutosaveTurn) return;
    if (t % AUTO_EVERY !== 0) return;
    lastAutosaveTurn = t;
    try { doLocalSave(AUTO_SLOT, { __auto: true }); } catch (_) {}
  }

  (function () {
    const _fi = window.focusInput;
    if (typeof _fi === 'function') {
      window.focusInput = function () {
        tryAutosave();
        return _fi.apply(this, arguments);
      };
    }
  })();

// =========================================================
//  BARRA RÁPIDA (2 filas) + BOTÓN DIAGONALES
//  Fila superior: Salidas · Salir · Inven · Entrar · Mirar
//  Fila inferior: Bajar · Oeste · Sur · Diag. · Norte · Este · Subir
//  Agrupación visual:
//    izquierda (rojo tenue) → salir / salidas / bajar
//    centro (neutro)        → direcciones + Diag
//    derecha (azul tenue)   → entrar / subir / mirar
// =========================================================
function addQuickBar() {
  if ($('#ng-quickbar')) return;
  const bar = document.createElement('div');

    { label: 'Inven.',  cmd: 'INVENTARIO',  cls: 'in primary' },

    { label: 'MIRAR',   cmd: 'MIRAR',       cls: 'in primary' },

    { label: 'Bajar',  cmd: 'BAJAR',      cls: 'out' },
    { label: 'Oeste',  cmd: 'OESTE',      cls: 'dir' },

    { label: 'Diag.',  cmd: '__DIAG__',   cls: 'diag' },
    { label: 'Norte',  cmd: 'NORTE',      cls: 'dir' },
    { label: 'Este',   cmd: 'ESTE',       cls: 'dir' },

    `<div class="ng-qb-row ng-qb-row-bot">${rowBot.map(renderBtn).join('')}</div>`;

  document.body.appendChild(bar);

  // Panel de diagonales
  addDiagPopup();

  bar.addEventListener('click', e => {
    const btn = e.target.closest('.ng-qb-btn');

    if (btn.dataset.cmd === '__DIAG__') {
      toggleDiag(btn);

    closeDiag();

  document.addEventListener('pointerdown', e => {
    const pop = $('#ng-diag-popup');

    if (e.target.closest('#ng-quickbar')) return;

  // ---- Panel desplegable de diagonales ----
  function addDiagPopup() {
    if ($('#ng-diag-popup')) return;
    const pop = document.createElement('div');
    pop.id = 'ng-diag-popup';
    pop.className = 'ng-diag-popup';
    pop.innerHTML = `
      <div class="ng-diag-grid">
        <button class="ng-qb-btn" data-cmd="NO">NO ↖</button>
        <button class="ng-qb-btn" data-cmd="NE">NE ↗</button>
        <button class="ng-qb-btn" data-cmd="SO">SO ↙</button>
        <button class="ng-qb-btn" data-cmd="SE">SE ↘</button>
      </div>`;
    document.body.appendChild(pop);

    pop.addEventListener('click', e => {
      const btn = e.target.closest('.ng-qb-btn');
      if (!btn) return;
      if (!canSendCommand()) return;
      closeDiag();
      try { window.orderEnteredLoop(btn.dataset.cmd); }
      catch (err) { console.warn('Quickbar diag:', err); }
    });
  }

  function openDiag(anchorEl) {
    const pop = $('#ng-diag-popup');
    if (!pop || !anchorEl) return;
    // Medimos primero con el popup visible
    pop.style.visibility = 'hidden';
    pop.classList.add('open');
    const pr = pop.getBoundingClientRect();
    const r  = anchorEl.getBoundingClientRect();

    let left = r.left + r.width / 2 - pr.width / 2;
    let top  = r.top - pr.height - 8;
    // Si no cabe arriba, lo abrimos debajo
    if (top < 8) top = r.bottom + 8;
    // Evitamos que se salga por los lados
    left = Math.max(8, Math.min(left, window.innerWidth - pr.width - 8));

    pop.style.left = left + 'px';
    pop.style.top  = top + 'px';
    pop.style.visibility = 'visible';

    const btn = $('#ng-quickbar').querySelector('[data-cmd="__DIAG__"]');
    if (btn) btn.classList.add('open');
  }

  function closeDiag() {
    const pop = $('#ng-diag-popup');
    if (pop) pop.classList.remove('open');
    const btn = $('#ng-quickbar') && $('#ng-quickbar').querySelector('[data-cmd="__DIAG__"]');
    if (btn) btn.classList.remove('open');
  }

  function toggleDiag(anchorEl) {
    const pop = $('#ng-diag-popup');
    if (!pop) return;
    if (pop.classList.contains('open')) closeDiag();
    else openDiag(anchorEl);
  }

  // =========================================================
  //  MODAL (sistema de vistas con pila)
  // =========================================================
  const viewStack = [];

  function ensureModal() {
    if ($('#ng-modal')) return;
    const modal = document.createElement('div');
    modal.id = 'ng-modal';
    modal.innerHTML = `
      <div id="ng-modal-box">
        <div id="ng-modal-head">
          <div>
            <button id="ng-modal-back" title="Atrás">‹</button>
            <span id="ng-modal-title"></span>
          </div>
          <button id="ng-modal-x" title="Cerrar">✕</button>
        </div>
        <div id="ng-modal-body"></div>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    $('#ng-modal-x').addEventListener('click', closeModal);
    $('#ng-modal-back').addEventListener('click', popView);
  }

  function setView(view)      { viewStack.push(view); renderTop(); }
  function pushView(view)     { setView(view); }
  function replaceView(view)  { viewStack.pop(); setView(view); }
  function popView() {
    if (viewStack.length > 1) { viewStack.pop(); renderTop(); }
    else closeModal();
  }
  function renderTop() {
    const v = viewStack[viewStack.length - 1];
    if (!v) return;
    $('#ng-modal-title').textContent = v.title || '';
    $('#ng-modal-body').innerHTML = v.html || '';
    $('#ng-modal-back').classList.toggle('visible', viewStack.length > 1);
    $('#ng-modal-body').scrollTop = 0;
    if (typeof v.onMount === 'function') v.onMount();
  }
  function openModal(rootView) {
    ensureModal();
    viewStack.length = 0;
    setView(rootView);
    $('#ng-modal').classList.add('open');
  }
  function closeModal() {
    viewStack.length = 0;
    const m = $('#ng-modal');
    if (m) m.classList.remove('open');
  }

  function item(icon, title, sub, id) {
    return `<div class="ng-item" id="${id}" data-act="${id}">
      <div class="ng-ico">${icon}</div>

        <b>${esc(title)}</b>
        ${sub ? `<small>${esc(sub)}</small>` : ''}
      </div>
      <div class="ng-arrow">›</div>
    </div>`;
  }
  function bindItems(map) {
    $('#ng-modal-body').querySelectorAll('.ng-item').forEach(el => {
      const act = el.dataset.act;
      el.addEventListener('click', () => { if (map[act]) map[act](); });
    });
  }

  function viewSave() {
    const last  = localStorage.getItem(LAST) || nextDefaultName();
    const saves = listSaves().filter(s => !s.auto);
    const rows  = saves.length
      ? saves.map(s => `
          <div class="ng-row">
            <span class="ng-row-name">${esc(s.name)}</span>
            <span class="ng-row-meta">${esc(s.date)} ${esc(s.loc)}</span>
            <button class="ng-btn mini" data-fill="${esc(s.name)}">Usar</button>
          </div>`).join('')
      : '<p style="color:#888;text-align:center;font-style:italic">Aún no hay partidas guardadas.</p>';

    return {
      title: '💾 Guardar',
      html: `
        <p style="color:#aaa;font-size:.88em">
          Escribe un nombre, o pulsa <b>Usar</b> en una existente para sobrescribirla.
        </p>
        <input id="ng-save-name" class="ng-input" type="text"
               value="${esc(last)}" autocomplete="off" maxlength="40" />
        <p class="ng-hint">Pulsa <b>Enter</b> para guardar al instante.</p>
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-bottom:14px">
          <button id="ng-save-go" class="ng-btn primary">Guardar</button>
        </div>
        <h3>Partidas existentes</h3>
        ${rows}
      `,
      onMount() {
        const input = $('#ng-save-name');
        const goBtn = $('#ng-save-go');
        setTimeout(() => { input.focus(); input.select(); }, 30);
        const doSave = () => {
          const name = input.value.trim();
          if (!name) { toast('Pon un nombre a la partida'); return; }
          try {
            doLocalSave(name);
            toast('💾 Guardado: ' + saveName(name));
            popView();
          } catch (e) { toast('Error al guardar: ' + e.message); }
        };
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSave(); }
        });
        goBtn.addEventListener('click', doSave);
        $('#ng-modal-body').querySelectorAll('[data-fill]').forEach(b => {
          b.addEventListener('click', () => {
            input.value = b.dataset.fill;
            input.focus(); input.select();
          });
        });

    };
  }

            try {
              const obj = JSON.parse(json);
              window.restoreSaveGameObject(obj);

              toast('📂 Cargada: ' + (name === AUTO_SLOT ? 'Autoguardado' : name));

  // =========================================================
  //  VISTA: EXPORTAR / IMPORTAR
  // =========================================================
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function exportSave(name) {
    const json = localStorage.getItem(PREFIX + name);
    if (!json) { toast('No encontrada'); return; }
    const clean = name.replace(/[^\w\-]/g, '_') || 'partida';
    downloadBlob(new Blob([json], { type: 'application/json' }), clean + '.json');
    toast('📤 Exportada: ' + name);
  }

  function exportAll() {
    const all = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k.startsWith(PREFIX)) continue;
      try { all[k.slice(PREFIX.length)] = JSON.parse(localStorage.getItem(k)); } catch (_) {}
    }
    if (!Object.keys(all).length) { toast('No hay partidas'); return; }
    downloadBlob(
      new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' }),
      'aventura-partidas.json'
    );
    toast('📤 Exportadas: ' + Object.keys(all).length);
  }

  function importSaves(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = JSON.parse(e.target.result);
        if (!data || typeof data !== 'object') throw new Error('Formato inválido');
        let count = 0;
        if (data.flags && Array.isArray(data.flags)) {
          // Una sola partida: usa el nombre del archivo
          let name = file.name.replace(/\.json$/i, '').replace(/[^\w\- ]/g, '').trim();
          if (!name) name = 'Importada';
          localStorage.setItem(PREFIX + saveName(name), JSON.stringify(data));
          count = 1;
        } else {
          // Varias partidas: cada clave es un nombre
          for (const k in data) {
            if (data[k] && data[k].flags && Array.isArray(data[k].flags)) {
              localStorage.setItem(PREFIX + saveName(k), JSON.stringify(data[k]));
              count++;
            }
          }
        }
        if (!count) throw new Error('No se encontraron partidas en el archivo');
        toast('📥 Importadas: ' + count);
        replaceView(viewLoad());
      } catch (err) {
        toast('Error al importar: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

                       'aventura-' + d + '.txt');

        });

    };

  // =========================================================
  //  VISTA: MAPA
  // =========================================================
  const DIR_OFFSET = {
    2: [0, -1],   // N
    3: [0,  1],   // S
    4: [1,  0],   // E
    5: [-1, 0],   // O
    6: [1, -1],   // NE
    7: [-1,-1],   // NO
    8: [1,  1],   // SE
    9: [-1, 1],   // SO
  };

  function buildMapData() {
    const visited = getVisitedSet();
    const conns = window.connections;
    if (!conns) return { coords: {}, visited };
    const current = window.getFlag(38);
    const coords = {};
    coords[current] = { x: 0, y: 0 };
    const queue = [current];
    const seen = new Set([current]);
    while (queue.length) {
      const loc = queue.shift();
      const c = conns[loc] || [];
      for (let dir = 2; dir <= 9; dir++) {
        const dest = c[dir];
        if (typeof dest !== 'number' || dest < 0) continue;
        if (seen.has(dest)) continue;
        const off = DIR_OFFSET[dir];
        if (!off) continue;
        coords[dest] = { x: coords[loc].x + off[0], y: coords[loc].y + off[1] };
        seen.add(dest);
        queue.push(dest);
      }
    }
    return { coords, visited, current };
  }

  function renderMapSVG() {
    const { coords, visited, current } = buildMapData();
    const keys = Object.keys(coords).filter(l => visited.has(Number(l)));
    if (!keys.length) return '<p style="color:#888;text-align:center;padding:20px">Aún no has explorado nada.</p>';

    const CELL = 56, PAD = 24;
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    keys.forEach(l => {
      const c = coords[l];
      minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x);
      minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y);
    });
    const W = (maxX - minX + 1) * CELL + PAD * 2;
    const H = (maxY - minY + 1) * CELL + PAD * 2;

    const pos = l => ({
      x: PAD + (coords[l].x - minX + 0.5) * CELL,
      y: PAD + (coords[l].y - minY + 0.5) * CELL
    });

    let lines = '';
    keys.forEach(l => {
      const c = window.connections[Number(l)] || [];
      for (let dir = 2; dir <= 9; dir++) {
        const dest = c[dir];
        if (!coords[dest] || !visited.has(dest)) continue;
        if (Number(l) >= dest) continue;
        const a = pos(l), b = pos(dest);
        lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
                  stroke="#3a3a3a" stroke-width="2"/>`;
      }
    });

    let circles = '';
    keys.forEach(l => {
      const p = pos(l);
      const isCurrent = Number(l) === current;
      const fill   = isCurrent ? '#2b6cb0' : '#1e1e1e';
      const stroke = isCurrent ? '#8ab4f8' : '#555';
      circles += `<circle cx="${p.x}" cy="${p.y}" r="${isCurrent ? 13 : 10}"
                  fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
      circles += `<text x="${p.x}" y="${p.y + 3.5}" text-anchor="middle"
                  font-size="9" fill="#fff" font-family="monospace">${l}</text>`;
    });

    return `<svg xmlns="http://www.w3.org/2000/svg"
              width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
              ${lines}${circles}
            </svg>`;
  }

            </div>
          `,
          onMount() {
            const state = JSON.parse(JSON.stringify(pal));

            const applyLive = () => {
              const root = document.documentElement;
              for (const key of Object.keys(state)) {
                const c = state[key];
                // Derivar hover automáticamente si no se ha especificado
                const hoverBg     = c.hoverBg     || c.bg;

                el.style.background = state[el.dataset.swatch].bg;

            document.querySelectorAll('#ng-modal-body input[type=color]').forEach(inp => {
              inp.addEventListener('input', () => {
                const cat  = inp.dataset.cat;
                const part = inp.dataset.part;
                state[cat][part] = inp.value;
                applyLive();
              });
            });

            $('#ng-c-reset').addEventListener('click', () => {
              const dp = window.NG_DEFAULT_PALETTE;
              for (const key of Object.keys(dp)) state[key] = { ...dp[key] };
              applyLive();
              document.querySelectorAll('#ng-modal-body input[type=color]').forEach(inp => {
                inp.value = state[inp.dataset.cat][inp.dataset.part];
              });
            });

            $('#ng-c-ok').addEventListener('click', () => {
              settings.quickbarPalette = state;
              saveSettings(settings);
              if (window.NG_applyBarSettings) window.NG_applyBarSettings();
              toast('Colores guardados'); popView();
            });
          }
        };
      }

  async function viewOffline() {
    let swSupported = ('serviceWorker' in navigator);
    let swReg = null, swActive = false, swController = false;
    let cacheName = null, cacheCount = 0, error = null;
    try {
      if (swSupported) {
        swReg = await navigator.serviceWorker.getRegistration();
        if (swReg) {
          swActive = !!swReg.active;
          swController = !!navigator.serviceWorker.controller;
        }
      }
      const names = await caches.keys();
      for (const name of names) {
        if (!name.startsWith('aventura')) continue;
        const c = await caches.open(name);
        const keys = await c.keys();
        if (keys.length > cacheCount) { cacheName = name; cacheCount = keys.length; }
      }
    } catch (e) { error = e.message; }

    const row = (label, value, ok) =>
      `<div class="ng-row">
         <span class="ng-row-name">${esc(label)}</span>
         <span class="ng-row-meta" style="color:${ok === false ? '#e88' : ok === true ? '#8d8' : '#ccc'}">
           ${esc(value)}
         </span>
       </div>`;

    return {
      title: '📡 Estado offline',
      html: `
        <p style="color:#aaa;font-size:.88em">Comprueba si la app está lista para funcionar sin conexión.</p>
        <h3>Servicio offline (SW)</h3>
        ${row('Soportado',    swSupported ? '✅ Sí' : '❌ No', swSupported)}
        ${row('Registrado',   swReg ? '✅ Sí' : '❌ No', !!swReg)}
        ${row('Activo',       swActive ? '✅ Sí' : '❌ No', swActive)}
        ${row('Controlando',  swController ? '✅ Sí' : '⚠️ Recarga', swController)}
        <h3>Archivos en caché</h3>
        ${row(cacheName || '(ninguno)', cacheCount + ' archivos', cacheCount > 30)}
        ${error ? `<h3>Errores</h3><p style="color:#f88;font-size:.85em">${esc(error)}</p>` : ''}
        <h3>Acciones</h3>
        <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
          <button id="ng-ck-recheck" class="ng-btn">🔁 Volver a comprobar</button>
          <button id="ng-ck-force"   class="ng-btn primary">⬇️ Forzar re-descarga de todo</button>
          <button id="ng-ck-clear"   class="ng-btn danger">🗑️ Borrar toda la caché</button>
        </div>
        <p style="color:#777;font-size:.8em;margin-top:16px">
          <b>Controlando ⚠️</b> → cierra y reabre la app, o recarga.
          Todo debería llegar a <b>~110 archivos</b>.
        </p>
      `,
      onMount() {
        $('#ng-ck-recheck').addEventListener('click', async () => replaceView(await viewOffline()));
        $('#ng-ck-force').addEventListener('click', () => {
          if (!navigator.serviceWorker.controller) { toast('Primero recarga la página'); return; }
          navigator.serviceWorker.controller.postMessage('FORCE_RECACHE');
          toast('Re-descargando caché...');
        });
        $('#ng-ck-clear').addEventListener('click', async () => {
          if (!confirm('¿Borrar toda la caché?')) return;
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
          toast('Caché borrada. Cierra y reabre la app.');
        });
      }
    };
  }

  function viewCommands() {
    return {
      title: '⌨️ Comandos',
      html: `
        <p style="color:#aaa;font-size:.88em">Elige una categoría.</p>
        ${COMMAND_CATEGORIES.map(c => item(c.icon, c.title, c.sub, 'cat-' + c.id)).join('')}
        <p style="color:#777;font-size:.8em;margin-top:14px">
          El parser también acepta sinónimos y frases largas.
        </p>
      `,
      onMount() {
        const map = {};
        COMMAND_CATEGORIES.forEach(c => {
          map['cat-' + c.id] = () => pushView(viewCommandCategory(c));
        });
        bindItems(map);
      }
    };
  }

  function viewCommandCategory(cat) {
    return {
      title: cat.icon + ' ' + cat.title,
      html: `
        <p style="color:#aaa;font-size:.88em">${esc(cat.intro)}</p>
        ${cat.items.map(([cmd, desc]) => `
          <div class="ng-row">
            <span class="ng-row-name"><code style="font-size:.92em">${esc(cmd)}</code></span>
            <span class="ng-row-meta">${esc(desc)}</span>
          </div>
        `).join('')}
      `
    };
  }

  // =========================================================

  function addMenuButton() {
    if ($('#ng-btn-menu')) return;
    const btn = document.createElement('button');
    btn.id = 'ng-btn-menu';
    btn.title = 'Menú';
    btn.setAttribute('aria-label', 'Menú');
    btn.textContent = '☰';
    btn.addEventListener('click', () => openModal(viewMain()));
    document.body.appendChild(btn);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('#ng-modal') && $('#ng-modal').classList.contains('open')) {
      closeModal();
      e.preventDefault();
    }
  });

  // =========================================================
  //  SUSTITUIR LOS prompt() DEL JUEGO
  // =========================================================
  function overrideGameSaveLoad() {
    if (typeof window.ACCsave === 'function')
      window.ACCsave = function () { openModal(viewSave()); };
    if (typeof window.ACCload === 'function')
      window.ACCload = function () { openModal(viewLoad()); };
  }

  // =========================================================
  //  SERVICE WORKER
  // =========================================================
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    navigator.serviceWorker.register('sw.js', { scope: './' })
      .then(reg => {
        console.log('SW registrado. Scope:', reg.scope);
        reg.update().catch(() => {});
      })
      .catch(err => console.warn('SW no registrado:', err));
  }

  // =========================================================
  //  INIT
  // =========================================================
  function init() {
    setTimeout(() => {
      try { applySettings(); } catch (_) {}
      addMenuButton();
      addQuickBar();
      applySettings();
      overrideGameSaveLoad();
      registerSW();
      console.log('Interfaz extra cargada.');
    }, 0);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }

  window.ngpaws = {
    openMenu:  () => openModal(viewMain()),
    showSave:  () => openModal(viewSave()),
    showLoad:  () => openModal(viewLoad()),
    showMap:   () => openModal(viewMap()),
    listSaves,
  };
})();
