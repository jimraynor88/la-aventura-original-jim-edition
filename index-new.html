<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Aventura Original</title>

<!-- Móvil -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Aventura">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="dat/intro.png">

<!-- Estilos del juego (van primero para que los nuestros puedan sobreescribir si hace falta) -->
<link href="css.css" rel="stylesheet" type="text/css" />

<!-- ============================================================
     INTERFAZ EXTRA: menú, guardado, guía, opciones
     ============================================================ -->
<style>
:root { --fs: 1; }

/* --- Ajuste de tamaño de fuente --- */
body { font-size: calc(120% * var(--fs)) !important; }
@media (max-width: 1024px) {
  body { font-size: calc(300% * var(--fs)) !important; }
}

/* --- Botón flotante del menú --- */
#ng-btn-menu {
  position: fixed;
  top: 10px;
  right: 10px;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  z-index: 1400;
  transition: background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(6px);
}
#ng-btn-menu:hover  { background: rgba(43,108,176,.85); transform: scale(1.05); }
#ng-btn-menu:active { transform: scale(.94); }

/* --- Capa modal --- */
#ng-modal {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  padding: 12px;
  box-sizing: border-box;
  font-family: Verdana, arial, helvetica, sans-serif;
}
#ng-modal.open { display: flex; }

#ng-modal-box {
  background: #131313;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  color: #eaeaea;
  box-shadow: 0 24px 60px rgba(0,0,0,.75);
  overflow: hidden;
}

#ng-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid #262626;
  font-size: 1.02em;
  color: #fff;
}
#ng-modal-title { font-weight: 600; letter-spacing: .02em; }
#ng-modal-back {
  background: none; border: none; color: #8ab4f8; font-size: 15px;
  cursor: pointer; padding: 4px 6px; margin-right: 6px; display: none;
}
#ng-modal-back.visible { display: inline-block; }
#ng-modal-x {
  background: none; border: none; color: #bbb; font-size: 20px;
  cursor: pointer; padding: 4px 8px;
}
#ng-modal-x:hover { color: #fff; }

#ng-modal-body {
  padding: 14px 16px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}
#ng-modal-body h3 {
  margin: 4px 0 10px;
  font-size: .85em;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: #7a7a7a;
  font-weight: 600;
  border-bottom: 1px solid #262626;
  padding-bottom: 6px;
}
#ng-modal-body h3:not(:first-child) { margin-top: 22px; }
#ng-modal-body p  { margin: 6px 0; font-size: .95em; line-height: 1.5; }
#ng-modal-body ul { margin: 6px 0 6px 20px; padding: 0; font-size: .95em; line-height: 1.55; }
#ng-modal-body li { margin: 4px 0; }
#ng-modal-body code {
  background: #262626; padding: 1px 6px; border-radius: 4px;
  font-family: monospace; font-size: .9em; color: #ffd580;
}

/* --- Filas de acción tipo "menú" --- */
.ng-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  background: #1b1b1b;
  border: 1px solid #262626;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
  transition: background .12s, border-color .12s, transform .1s;
  -webkit-tap-highlight-color: transparent;
}
.ng-item:hover  { background: #232323; border-color: #333; }
.ng-item:active { transform: scale(.985); }
.ng-item .ng-ico { font-size: 20px; width: 26px; text-align: center; }
.ng-item .ng-txt { flex: 1; }
.ng-item .ng-txt b { display: block; font-weight: 600; color: #fff; font-size: .97em; }
.ng-item .ng-txt small { color: #8a8a8a; font-size: .82em; }
.ng-item .ng-arrow { color: #666; font-size: 16px; }

/* --- Botones genéricos --- */
.ng-btn {
  padding: 9px 16px;
  border-radius: 8px;
  border: 1px solid #3a3a3a;
  background: #1f1f1f; color: #eee;
  cursor: pointer; font-size: .92em;
  transition: background .12s, border-color .12s;
}
.ng-btn:hover { background: #2a2a2a; border-color: #444; }
.ng-btn.primary { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
.ng-btn.primary:hover { background: #377cc0; }
.ng-btn.danger { background: #7a1f1f; border-color: #7a1f1f; color: #fff; }
.ng-btn.danger:hover { background: #a12a2a; }
.ng-btn.mini { padding: 5px 11px; font-size: .84em; }

/* --- Input de nombre de partida --- */
.ng-input {
  width: 100%; box-sizing: border-box;
  padding: 11px 13px;
  border-radius: 9px;
  border: 1px solid #3a3a3a;
  background: #0b0b0b; color: #fff;
  font-size: 1em; outline: none;
  font-family: inherit;
}
.ng-input:focus { border-color: #2b6cb0; }
.ng-hint { font-size: .82em; color: #777; margin: 8px 0 14px; }

/* --- Filas de partidas --- */
.ng-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: #1b1b1b;
  border: 1px solid #262626;
  border-radius: 9px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.ng-row .ng-row-name { flex: 1; font-weight: 600; min-width: 120px; }
.ng-row .ng-row-meta { font-size: .78em; color: #888; white-space: nowrap; }
.ng-row .ng-row-actions { display: flex; gap: 6px; }

/* --- Slider --- */
.ng-slider-row {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 0 12px;
}
.ng-slider-row input[type=range] {
  flex: 1;
  accent-color: #2b6cb0;
}
.ng-slider-val { min-width: 52px; text-align: right; color: #bbb; font-size: .9em; }

/* --- Toast --- */
.ng-toast {
  position: fixed; left: 50%; bottom: 26px;
  transform: translate(-50%, 20px);
  background: rgba(20,20,20,.96);
  color: #fff;
  padding: 10px 20px;
  border-radius: 999px;
  border: 1px solid #333;
  font-family: Verdana, sans-serif;
  font-size: .9em;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  z-index: 2100;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.ng-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* --- "Ocupado..." del SW --- */
#ng-busy {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  display: none; align-items: center; justify-content: center;
  z-index: 2200; color: #ccc; font-family: Verdana, sans-serif;
}
#ng-busy.show { display: flex; }
</style>
</head>
<body>

<!-- ============================================================
     Estructura del juego (idéntica a la original, HTML corregido)
     ============================================================ -->
<div class='wrapper'>
  <div class='graphics'></div>
  <div aria-live="polite" class='text'></div>
  <div class='input'>
    <input aria-live="polite" type='text' class='prompt' />
  </div>
</div>

<div class='block_layer'>
  <div class='block_graphics'></div>
  <div class='block_text'></div>
</div>

<div class='transcript_layer'>
  <span id='transcript_area'></span>
</div>

<div class='anykey_layer'></div>

<!-- ============================================================
     Motor del juego (NO TOCAR)
     ============================================================ -->
<script type="text/javascript" src="jquery.js"></script>
<script type="text/javascript" src="buzz.js"></script>
<script type='text/javascript' src='code.js'></script>

<!-- ============================================================
     INTERFAZ EXTRA: menú, guardado, guía, opciones, PWA
     ============================================================ -->
<script>
(function () {
  'use strict';

  // =========================================================
  //  UTILIDADES
  // =========================================================
  const PREFIX = 'ngpaws_savegame_';
  const LAST   = 'ngpaws_last_save_name';
  const SETTINGS_KEY = 'ngpaws_settings';

  const $ = sel => document.querySelector(sel);

  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function listSaves() {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key.startsWith(PREFIX)) continue;
      const name = key.slice(PREFIX.length);
      let date = '', loc = '';
      try {
        const data = JSON.parse(localStorage.getItem(key));
        if (data.__savedAt) date = new Date(data.__savedAt).toLocaleString();
        if (data.flags && typeof data.flags[38] === 'number') loc = '📍 ' + data.flags[38];
      } catch (_) {}
      out.push({ name, date, loc });
    }
    out.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true }));
    return out;
  }

  function nextDefaultName() {
    const saves = listSaves();
    let n = 1;
    while (saves.some(s => s.name === 'Partida ' + n)) n++;
    return 'Partida ' + n;
  }

  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'ng-toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.classList.add('show'), 10);
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, 2200);
  }

  function busy(msg) {
    let el = document.getElementById('ng-busy');
    if (!el) {
      el = document.createElement('div');
      el.id = 'ng-busy';
      document.body.appendChild(el);
    }
    el.textContent = msg || 'Un momento...';
    el.classList.add('show');
  }
  function notBusy() {
    const el = document.getElementById('ng-busy');
    if (el) el.classList.remove('show');
  }

  // =========================================================
  //  AJUSTES PERSISTENTES
  // =========================================================
  function loadSettings() {
    try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch (_) { return {}; }
  }
  function saveSettings(s) {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
  }

  let settings = loadSettings();

  function applySettings() {
    // Fuente
    const fs = settings.fontScale || 1;
    document.documentElement.style.setProperty('--fs', fs);
    // Sonido
    if (typeof window.ACCsound === 'function') {
      window.ACCsound(settings.sound === false ? 0 : 1);
    }
    // Gráficos
    if (typeof window.ACCgraphic === 'function') {
      window.ACCgraphic(settings.graphics === false ? 0 : 1);
    }
  }

  // =========================================================
  //  MODAL — sistema de vistas con pila (para los submenús)
  // =========================================================
  const viewStack = [];

  function ensureModal() {
    if ($('#ng-modal')) return;
    const modal = document.createElement('div');
    modal.id = 'ng-modal';
    modal.innerHTML = `
      <div id="ng-modal-box">
        <div id="ng-modal-head">
          <div>
            <button id="ng-modal-back" title="Atrás">‹</button>
            <span id="ng-modal-title"></span>
          </div>
          <button id="ng-modal-x" title="Cerrar">✕</button>
        </div>
        <div id="ng-modal-body"></div>
      </div>`;
    document.body.appendChild(modal);

    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });
    $('#ng-modal-x').addEventListener('click', closeModal);
    $('#ng-modal-back').addEventListener('click', popView);
  }

  function setView(view) {
    // view = { title, html, onMount }
    viewStack.push(view);
    renderTop();
  }
  function pushView(view) { setView(view); }
  function popView() {
    if (viewStack.length > 1) {
      viewStack.pop();
      renderTop();
    } else {
      closeModal();
    }
  }
  function replaceView(view) {
    viewStack.pop();
    setView(view);
  }
  function renderTop() {
    const v = viewStack[viewStack.length - 1];
    if (!v) return;
    $('#ng-modal-title').textContent = v.title || '';
    $('#ng-modal-body').innerHTML = v.html || '';
    const back = $('#ng-modal-back');
    if (viewStack.length > 1) back.classList.add('visible');
    else back.classList.remove('visible');
    $('#ng-modal-body').scrollTop = 0;
    if (typeof v.onMount === 'function') v.onMount();
  }

  function openModal(rootView) {
    ensureModal();
    viewStack.length = 0;
    setView(rootView);
    $('#ng-modal').classList.add('open');
  }
  function closeModal() {
    viewStack.length = 0;
    const m = $('#ng-modal');
    if (m) m.classList.remove('open');
  }

  // =========================================================
  //  VISTAS
  // =========================================================

  // ---------- VISTA: MENÚ PRINCIPAL ----------
  function viewMain() {
    return {
      title: 'Menú',
      html: `
        <h3>Partida</h3>
        ${item('💾', 'Guardar partida', 'Crea o sobrescribe una partida guardada',
               'ng-go-save')}
        ${item('📂', 'Cargar partida', 'Retoma una partida guardada anteriormente',
               'ng-go-load')}
        ${item('🔄', 'Reiniciar juego', 'Empezar la aventura desde el principio',
               'ng-go-restart')}

        <h3>Opciones</h3>
        ${item('🔠', 'Tamaño de letra', 'Ajusta el tamaño del texto',
               'ng-go-font')}
        ${item('🔊', 'Sonido', settings.sound === false ? 'Desactivado' : 'Activado',
               'ng-go-sound')}
        ${item('🖼️', 'Gráficos', settings.graphics === false ? 'Desactivados' : 'Activados',
               'ng-go-graphics')}

        <h3>Ayuda</h3>
        ${item('📖', 'Cómo jugar', 'Guía básica de la aventura', 'ng-go-guide')}
        ${item('⌨️', 'Comandos', 'Lista de verbos y ejemplos', 'ng-go-commands')}
        ${item('ℹ️', 'Acerca de', 'Créditos e información', 'ng-go-about')}
      `,
      onMount() {
        $('#ng-modal-body').querySelectorAll('.ng-item').forEach(el => {
          el.addEventListener('click', () => {
            const id = el.id;
            if (id === 'ng-go-save')     pushView(viewSave());
            if (id === 'ng-go-load')     pushView(viewLoad());
            if (id === 'ng-go-restart')  pushView(viewRestart());
            if (id === 'ng-go-font')     pushView(viewFont());
            if (id === 'ng-go-sound')    { toggleSound(); replaceView(viewMain()); }
            if (id === 'ng-go-graphics') { toggleGraphics(); replaceView(viewMain()); }
            if (id === 'ng-go-guide')    pushView(viewGuide());
            if (id === 'ng-go-commands') pushView(viewCommands());
            if (id === 'ng-go-about')    pushView(viewAbout());
          });
        });
      }
    };
  }

  function item(icon, title, sub, id) {
    return `<div class="ng-item" id="${id}">
      <div class="ng-ico">${icon}</div>
      <div class="ng-txt"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
      <div class="ng-arrow">›</div>
    </div>`;
  }

  // ---------- VISTA: GUARDAR ----------
  function viewSave() {
    const last = localStorage.getItem(LAST) || nextDefaultName();
    const saves = listSaves();
    const rows = saves.length
      ? saves.map(s => `
          <div class="ng-row">
            <span class="ng-row-name">${esc(s.name)}</span>
            <span class="ng-row-meta">${esc(s.date)} ${esc(s.loc)}</span>
            <button class="ng-btn mini" data-fill="${esc(s.name)}">Usar</button>
          </div>`).join('')
      : '<p style="color:#888;text-align:center;font-style:italic">Aún no hay partidas guardadas.</p>';

    return {
      title: '💾 Guardar',
      html: `
        <p style="color:#aaa;font-size:.92em">
          Escribe un nombre nuevo, o pulsa <b>Usar</b> en una partida existente para sobrescribirla.
        </p>
        <input id="ng-save-name" class="ng-input" type="text"
               value="${esc(last)}" autocomplete="off" maxlength="40" />
        <p class="ng-hint">Pulsa <b>Enter</b> para guardar directamente.</p>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:18px">
          <button id="ng-save-go" class="ng-btn primary">Guardar</button>
        </div>
        <h3>Partidas existentes</h3>
        ${rows}
      `,
      onMount() {
        const input = $('#ng-save-name');
        const goBtn = $('#ng-save-go');
        setTimeout(() => { input.focus(); input.select(); }, 30);

        const doSave = () => {
          const name = input.value.trim().toUpperCase();
          if (!name) { toast('Pon un nombre a la partida'); return; }
          try {
            const obj = window.getSaveGameObject();
            obj.__savedAt = Date.now();
            localStorage.setItem(PREFIX + name, JSON.stringify(obj));
            localStorage.setItem(LAST, name);
            toast('💾 Guardado: ' + name);
            popView();  // vuelve al menú
          } catch (e) {
            toast('Error al guardar: ' + e.message);
          }
        };

        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); doSave(); }
        });
        goBtn.addEventListener('click', doSave);

        $('#ng-modal-body').querySelectorAll('[data-fill]').forEach(b => {
          b.addEventListener('click', () => {
            input.value = b.dataset.fill;
            input.focus(); input.select();
          });
        });
      }
    };
  }

  // ---------- VISTA: CARGAR ----------
  function viewLoad() {
    const saves = listSaves();
    const rows = saves.length
      ? saves.map(s => `
          <div class="ng-row">
            <span class="ng-row-name">${esc(s.name)}</span>
            <span class="ng-row-meta">${esc(s.date)} ${esc(s.loc)}</span>
            <div class="ng-row-actions">
              <button class="ng-btn primary mini" data-load="${esc(s.name)}">Cargar</button>
              <button class="ng-btn danger mini"  data-del="${esc(s.name)}" title="Borrar">🗑️</button>
            </div>
          </div>`).join('')
      : '<p style="color:#888;text-align:center;font-style:italic">No hay partidas guardadas.</p>';

    return {
      title: '📂 Cargar',
      html: `<h3>Selecciona una partida</h3>${rows}`,
      onMount() {
        $('#ng-modal-body').querySelectorAll('[data-load]').forEach(b => {
          b.addEventListener('click', () => {
            const name = b.dataset.load;
            const json = localStorage.getItem(PREFIX + name);
            if (!json) { toast('No encontrada'); return; }
            try {
              const obj = JSON.parse(json);
              window.restoreSaveGameObject(obj);
              closeModal();
              if (typeof window.descriptionLoop === 'function') window.descriptionLoop();
              toast('📂 Cargada: ' + name);
            } catch (e) {
              toast('Error al cargar: ' + e.message);
            }
          });
        });
        $('#ng-modal-body').querySelectorAll('[data-del]').forEach(b => {
          b.addEventListener('click', () => {
            const name = b.dataset.del;
            if (!confirm('¿Borrar la partida «' + name + '»?')) return;
            localStorage.removeItem(PREFIX + name);
            if (localStorage.getItem(LAST) === name) localStorage.removeItem(LAST);
            replaceView(viewLoad());
            toast('🗑️ Borrada: ' + name);
          });
        });
      }
    };
  }

  // ---------- VISTA: REINICIAR ----------
  function viewRestart() {
    return {
      title: '🔄 Reiniciar',
      html: `
        <p>¿Seguro que quieres <b>reiniciar</b> la aventura?</p>
        <p style="color:#888;font-size:.88em">
          Perderás el progreso actual. Tus partidas guardadas se mantienen intactas.
        </p>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
          <button id="ng-restart-no"  class="ng-btn">Cancelar</button>
          <button id="ng-restart-yes" class="ng-btn danger">Reiniciar</button>
        </div>
      `,
      onMount() {
        $('#ng-restart-no').addEventListener('click', popView);
        $('#ng-restart-yes').addEventListener('click', () => {
          location.reload();
        });
      }
    };
  }

  // ---------- VISTA: TAMAÑO DE FUENTE ----------
  function viewFont() {
    const current = settings.fontScale || 1;
    const pct = Math.round(current * 100);
    return {
      title: '🔠 Tamaño de letra',
      html: `
        <p>Ajusta el tamaño del texto cómodamente según tu pantalla.</p>
        <div class="ng-slider-row">
          <span style="color:#888">A</span>
          <input id="ng-font-range" type="range" min="70" max="200" step="10" value="${pct}" />
          <span style="color:#ccc;font-size:1.4em">A</span>
          <span id="ng-font-val" class="ng-slider-val">${pct}%</span>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
          <button id="ng-font-reset" class="ng-btn">Restablecer</button>
          <button id="ng-font-ok"    class="ng-btn primary">Aplicar</button>
        </div>
      `,
      onMount() {
        const range = $('#ng-font-range');
        const val   = $('#ng-font-val');
        range.addEventListener('input', () => {
          val.textContent = range.value + '%';
          document.documentElement.style.setProperty('--fs', range.value / 100);
        });
        $('#ng-font-reset').addEventListener('click', () => {
          range.value = 100;
          val.textContent = '100%';
          document.documentElement.style.setProperty('--fs', 1);
        });
        $('#ng-font-ok').addEventListener('click', () => {
          settings.fontScale = range.value / 100;
          saveSettings(settings);
          applySettings();
          toast('Fuente aplicada');
          popView();
        });
      }
    };
  }

  function toggleSound() {
    settings.sound = settings.sound === false ? true : false;
    saveSettings(settings);
    applySettings();
    toast(settings.sound === false ? '🔇 Sonido desactivado' : '🔊 Sonido activado');
  }
  function toggleGraphics() {
    settings.graphics = settings.graphics === false ? true : false;
    saveSettings(settings);
    applySettings();
    toast(settings.graphics === false ? '🖼️ Gráficos desactivados' : '🖼️ Gráficos activados');
  }

  // =========================================================
  //  BOTÓN FLOTANTE + ATAJOS
  // =========================================================
  function addMenuButton() {
    if ($('#ng-btn-menu')) return;
    const btn = document.createElement('button');
    btn.id = 'ng-btn-menu';
    btn.title = 'Menú';
    btn.setAttribute('aria-label', 'Menú');
    btn.textContent = '☰';
    btn.addEventListener('click', () => openModal(viewMain()));
    document.body.appendChild(btn);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('#ng-modal') && $('#ng-modal').classList.contains('open')) {
        closeModal();
        e.preventDefault();
      }
    }
  });

  // =========================================================
  //  SUSTITUIR LOS prompt() FEO DEL JUEGO
  // =========================================================
  function overrideGameSaveLoad() {
    if (typeof window.ACCsave === 'function') {
      window.ACCsave = function () { openModal(viewSave()); };
    }
    if (typeof window.ACCload === 'function') {
      window.ACCload = function () { openModal(viewLoad()); };
    }
  }

  // =========================================================
  //  REGISTRAR SERVICE WORKER
  // =========================================================
  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registrado. Scope:', reg.scope))
        .catch(err => console.warn('SW no registrado:', err));
    });
  }

  // =========================================================
  //  INICIALIZACIÓN
  // =========================================================
  function init() {
    // Espera a que el motor del juego esté listo (document.ready ya disparó)
    setTimeout(() => {
      try { applySettings(); } catch (_) {}
      addMenuButton();
      overrideGameSaveLoad();
      registerSW();
      console.log('Interfaz extra cargada.');
    }, 0);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }

  // Exponer para depurar desde consola
  window.ngpaws = {
    openMenu: () => openModal(viewMain()),
    showSave: () => openModal(viewSave()),
    showLoad: () => openModal(viewLoad()),
    listSaves
  };
})();
